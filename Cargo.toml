[workspace]
resolver = "2"
members = [
    "crates/esc-protocol",
    "crates/esc-configurator-cli",
    "crates/esc-relay-core",
    "crates/esc-relay-fw",
    "crates/rtttl-rs",
]

# Exclude embedded firmware from default workspace operations
# Build it explicitly with: cargo build -p esc-relay-fw --target thumbv8m.main-none-eabihf
default-members = [
    "crates/esc-protocol",
    "crates/esc-configurator-cli",
    "crates/esc-relay-core",
    "crates/rtttl-rs",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ragarnoy/esc-config-rs"

[workspace.dependencies]
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
serialport = "4.8"
dialoguer = "0.12"
embassy-rp = { git = "https://github.com/embassy-rs/embassy", branch = "main" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", branch = "main" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", branch = "main" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", branch = "main" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy", branch = "main" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", branch = "main" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", branch = "main" }
embassy-usb = { git = "https://github.com/embassy-rs/embassy", branch = "main" }

[patch.crates-io]
embassy-rp = { git = "https://github.com/embassy-rs/embassy", branch = "main" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", branch = "main" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", branch = "main" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy", branch = "main" }

[profile.release]
debug = 2
lto = false
opt-level = 2
