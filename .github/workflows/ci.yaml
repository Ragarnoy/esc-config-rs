name: CI

on:
  push:
    branches: [master, revamp]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Test, clippy, fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for serialport
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: rustfmt
        run: cargo fmt --all --check
      - name: Clippy (no warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: |
          cargo test
          cargo test -p esc-config-icd --features session
      - name: Test relay frame buffer (host)
        run: |
          rustc --edition 2024 --test crates/esc-relay-fw/src/frame_buf.rs -o "$RUNNER_TEMP/frame_buf"
          "$RUNNER_TEMP/frame_buf"

  no-std:
    name: no_std crates (thumbv8m)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          cargo build --target thumbv8m.main-none-eabihf -p esc-protocol -p esc-session -p esc-config-icd -p rtttl-rs
          cargo build --target thumbv8m.main-none-eabihf -p esc-config-icd --features session
          cargo build --target thumbv8m.main-none-eabihf -p esc-onewire-rp --features rp235xa
      - name: Clippy (no warnings)
        run: |
          cargo clippy --target thumbv8m.main-none-eabihf -p esc-protocol -p esc-session -p esc-config-icd -p rtttl-rs -- -D warnings
          cargo clippy --target thumbv8m.main-none-eabihf -p esc-onewire-rp --features rp235xa -- -D warnings

  firmware:
    name: Relay firmware (RP2350)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The crate's .cargo/config.toml selects the thumbv8m target.
      - name: Build
        working-directory: crates/esc-relay-fw
        run: cargo build --release
      - name: Clippy (no warnings)
        working-directory: crates/esc-relay-fw
        run: cargo clippy --release -- -D warnings
