[package]
name = "esc-relay-fw"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ESC configurator relay firmware for RP2350"

[features]
default = []

[[bin]]
name = "esc-relay-fw"
path = "src/main.rs"

[dependencies]
# Embassy
embassy-executor = { workspace = true, features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-rp = { workspace = true, features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xa"] }
embassy-time = { workspace = true, features = ["defmt", "defmt-timestamp-uptime"] }
embassy-usb = { workspace = true, features = ["defmt"] }
embassy-sync = { workspace = true, features = ["defmt"] }
embassy-futures = "0.1"

# Cortex-M
cortex-m-rt = "0.7"

# Logging
defmt = { version = "1.0.1" }
defmt-rtt = { version = "1.1.0" }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# Misc
static_cell = "2"
fixed = "1.28"
