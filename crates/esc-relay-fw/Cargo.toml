[package]
name = "esc-relay-fw"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ESC configurator relay firmware for RP2350"

[features]
default = []

[[bin]]
name = "esc-relay-fw"
path = "src/main.rs"

[dependencies]
# Embassy
embassy-executor = { workspace = true, features = ["defmt"] }
embassy-rp = { workspace = true, features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xa", "executor-thread"] }
embassy-time = { workspace = true, features = ["defmt", "defmt-timestamp-uptime"] }
embassy-usb = { workspace = true, features = ["defmt"] }
embassy-sync = { workspace = true, features = ["defmt"] }
embassy-futures.workspace = true

# Cortex-M
cortex-m-rt = "0.7"

# Logging
defmt = { version = "1.0.1" }
defmt-rtt = { version = "1.1.0" }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# ESC session and ICD
esc-session = { path = "../esc-session" }
esc-protocol = { path = "../esc-protocol" }
esc-config-icd = { path = "../esc-config-icd", features = ["session"] }
esc-onewire-rp = { path = "../esc-onewire-rp", features = ["rp235xa", "defmt"] }

# postcard-rpc over CDC (COBS)
postcard.workspace = true
postcard-rpc.workspace = true
serde.workspace = true
cobs.workspace = true

# Misc
static_cell = "2"
