[package]
name = "esc-configurator-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI tool for configuring BLHeli/AM32 ESCs"

[dependencies]
esc-protocol = { path = "../esc-protocol", features = ["std", "serde"] }
esc-config-icd = { path = "../esc-config-icd", features = ["use-std"] }
postcard-rpc = { workspace = true, features = ["use-std", "cobs-serial"] }
postcard-schema = { workspace = true, features = ["use-std"] }
heapless.workspace = true
tokio = { version = "1", features = ["rt", "time"] }
clap.workspace = true
anyhow.workspace = true
serialport.workspace = true
dialoguer.workspace = true
toml.workspace = true
serde = { version = "1.0", features = ["derive"] }
indicatif = "0.18"

[[bin]]
name = "esc-configurator"
path = "src/main.rs"
